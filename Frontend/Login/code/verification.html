<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d26">
  <title>Verify account | Draft Masters League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-stage">
    <section class="auth-card" aria-labelledby="page-title">
      <img class="brand" src="../../../Backend/Images/DML_Shield_Green_Colourway_Transparent.png" alt="Draft Masters League" width="88" height="88">
      <p class="eyebrow">Draft Masters League</p>
      <h1 id="page-title">Enter code to verify account</h1>
      <p class="intro">Enter the six-digit code sent to your email after creating your account.</p>
      <div class="form-note" role="status">Email code delivery is being set up. No code has been sent from this preview.</div>
      <form aria-label="Verify account" onsubmit="return false">
        <label for="code">Verification code</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" disabled>
        <button type="submit" disabled>Verify account</button>
      </form>
      <p class="switch"><a href="index.html">Back to sign in</a></p>
    </section>
    </div>
  <footer class="legal-footer" aria-label="Legal and contact links">
    <a href="terms-and-conditions.html">Terms and Conditions</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="mailto:draftmastersleague@gmail.com">Contact Us</a>
  </footer>
  </main>
</body>
</html>
