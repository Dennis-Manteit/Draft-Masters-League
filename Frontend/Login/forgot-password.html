<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d26">
  <title>Reset password | Draft Masters League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-stage">
      <section class="auth-card" aria-labelledby="page-title">
        <img class="brand" src="../../Backend/Images/DML_Shield_Green_Colourway_Transparent.png" alt="Draft Masters League" width="88" height="88">
        <p class="eyebrow">Draft Masters League</p>
        <h1 id="page-title">Reset your password</h1>
        <p class="intro">Enter your account email to request a reset link.</p>
        <div id="auth-status" class="form-note" role="status" aria-live="polite">Connecting account recovery…</div>
        <form id="password-reset-form" aria-label="Reset password">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" required disabled>
          <button type="submit" disabled>Send reset link</button>
        </form>
        <p class="switch"><a href="index.html">Return to sign in</a></p>
      </section>
    </div>
    <footer class="legal-footer" aria-label="Legal and contact links">
      <a href="terms-and-conditions.html">Terms and Conditions</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="mailto:draftmastersleague@gmail.com">Contact Us</a>
    </footer>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
