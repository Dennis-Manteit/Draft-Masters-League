<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d26">
  <title>Create account | Draft Masters League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-stage">
    <section class="auth-card" aria-labelledby="page-title">
      <img class="brand" src="../../Backend/Images/Website%20Page/DML_Shield_Green_Colourway_Transparent.png" alt="Draft Masters League" width="88" height="88">
      <p class="eyebrow">Draft Masters League</p>
      <h1 id="page-title">Create account</h1>
      <p class="intro">Join the league when registration opens.</p>
      <div class="form-note" role="status">Registration is being set up. This preview does not collect personal information yet.</div>
      <form aria-label="Create account" onsubmit="return false">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" disabled>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" disabled>
        <button type="submit" disabled>Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="index.html">Sign in</a></p>
    </section>
    </div>
  <footer class="legal-footer" aria-label="Legal and contact links">
    <a href="https://github.com/Dennis-Manteit/Draft-Masters-League/blob/main/Backend/Rules/Terms%20and%20Conditions/Terms_and_Conditions.md">Terms and Conditions</a>
    <a href="https://github.com/Dennis-Manteit/Draft-Masters-League/blob/main/Backend/Rules/Privacy%20Policy/Privacy_Policy.md">Privacy Policy</a>
    <a href="mailto:draftmastersleague@gmail.com">Contact Us</a>
  </footer>
  </main>
</body>
</html>
