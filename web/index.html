<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <title>Sign in | Draft Masters League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Draft Masters League">
      <img class="shield" src="dml-shield.png" alt="DML shield" width="240" height="240">
      <span class="eyebrow">Fantasy Rugby League</span>
      <h1>DRAFT<br>MASTERS<br><span>LEAGUE</span></h1>
    </div>
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title">Sign in to DML</h2>
      <p class="intro">Your league starts here.</p>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="options">
          <label class="remember"><input id="remember" type="checkbox"> Remember me</label>
          <button id="reset" class="text-button" type="button">Forgot password?</button>
        </div>
        <button id="submit" class="primary" type="submit">Sign in</button>
      </form>
      <form id="signup-form" hidden>
        <label for="signup-email">Email address</label>
        <input id="signup-email" type="email" autocomplete="email" inputmode="email" required>
        <label for="signup-password">Create password</label>
        <input id="signup-password" type="password" autocomplete="new-password" minlength="6" required>
        <label for="signup-confirm">Confirm password</label>
        <input id="signup-confirm" type="password" autocomplete="new-password" minlength="6" required>
        <label class="consent"><input id="terms" type="checkbox" required> I agree to the <a href="https://github.com/Dennis-Manteit/Draft-Masters-League/blob/main/Backend/Rules/Terms%20and%20Conditions/Terms_and_Conditions.md" target="_blank" rel="noopener noreferrer">DML Terms &amp; Conditions</a>.</label>
        <button id="signup-submit" class="primary" type="submit">Create account</button>
      </form>
      <div id="verify-email" hidden>
        <p>Check your inbox for a DML verification email, then confirm your address before continuing.</p>
        <button id="check-verification" class="primary" type="button">I've verified my email</button>
        <button id="verify-sign-out" class="text-button secondary-action" type="button">Sign out</button>
      </div>
      <div class="divider"><span>or</span></div>
      <button id="google" class="google" type="button">Continue with Google</button>
      <button id="switch-mode" class="text-button secondary-action" type="button">Create a DML account</button>
      <div id="signed-in" hidden>
        <p>You're signed in to DML as <strong id="account-email"></strong>.</p>
        <button id="sign-out" class="primary" type="button">Sign out</button>
      </div>
    </section>
  </main>
  <div id="goal-animation" class="goal-animation" hidden aria-hidden="true">
    <div class="goal-scene">
      <span class="post left"></span><span class="post right"></span><span class="crossbar"></span>
      <span class="rugby-ball"></span>
    </div>
  </div>
  <footer>Draft Masters League · <span>Terms &amp; Conditions and Privacy Policy are being prepared.</span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
