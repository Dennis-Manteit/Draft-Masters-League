<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d26">
  <title>Verify account | Draft Masters League</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-stage">
    <section class="auth-card" aria-labelledby="page-title">
      <img class="brand" src="assets/DML_Shield_Green_Colourway_Transparent.png" alt="Draft Masters League" width="88" height="88">
      <p class="eyebrow">Draft Masters League</p>
      <h1 id="page-title">Verify your email</h1>
      <p class="intro">Open the verification link in your email, then return here to continue. Check your spam folder if you cannot find it.</p>
      <div id="auth-status" class="form-note" role="status">Checking your account…</div>
      <button id="check-verification" type="button" disabled>I have verified my email</button>
      <button id="resend-verification" type="button" disabled>Resend verification email</button>
      <p class="switch"><a href="login.html">Back to sign in</a></p>
    </section>
    </div>
  <footer class="legal-footer" aria-label="Legal and contact links">
    <a href="terms-and-conditions.html">Terms and Conditions</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="mailto:draftmastersleague@gmail.com">Contact Us</a>
  </footer>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
