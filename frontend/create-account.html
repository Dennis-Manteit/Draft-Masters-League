<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092d26">
  <title>Create account | Draft Masters League</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-stage">
    <section class="auth-card" aria-labelledby="page-title">
      <img class="brand" src="assets/DML_Shield_Green_Colourway_Transparent.png" alt="Draft Masters League" width="88" height="88">
      <p class="eyebrow">Draft Masters League</p>
      <h1 id="page-title">Create account</h1>
      <p class="intro">Set up your DML account. NRL Fantasy team linking will be available later.</p>
      <div id="auth-status" class="form-note" role="status">Loading registration…</div>
      <form id="registration-form" aria-label="Create account">
        <label for="first-name">First name</label>
        <input id="first-name" type="text" autocomplete="given-name" disabled required>
        <label for="last-name">Last name</label>
        <input id="last-name" type="text" autocomplete="family-name" disabled required>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" disabled required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" disabled required aria-describedby="password-help">
        <p id="password-help" class="field-help">Use at least 8 characters.</p>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" disabled required>
        <div class="consent-row">
          <input id="legal-consent" type="checkbox" disabled required>
          <label for="legal-consent">I confirm that I am at least 18 and have read and accept the <a href="terms-and-conditions.html">Terms and Conditions</a> and <a href="privacy-policy.html">Privacy Policy</a>.</label>
        </div>
        <button type="submit" disabled>Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
    </div>
  <footer class="legal-footer" aria-label="Legal and contact links">
    <a href="terms-and-conditions.html">Terms and Conditions</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="mailto:draftmastersleague@gmail.com">Contact Us</a>
  </footer>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
